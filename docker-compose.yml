services:
  postgres:
    image: postgres:17
    container_name: universal-commerce-postgres
    environment:
      POSTGRES_DB: universal_commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d universal_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
